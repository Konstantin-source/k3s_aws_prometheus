apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-

labels:
  - pairs:
      environment: production

resources:
  - ../../base
  - hpa.yaml

patches:
  - path: replica-patch.yaml
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: "prod-postgres-service"

